<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        /* Pengaturan Kertas A4 */
        @page { size: A4; margin: 0; }
        body { 
            font-family: 'Times New Roman', Times, serif; 
            padding: 50px 60px; 
            color: #000; 
            background: #fff;
            position: relative;
            box-sizing: border-box;
            height: 100vh;
        }

        /* Header: Logo & Judul */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #000; 
            padding-bottom: 10px; 
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { width: 90px; height: auto; }
        .studio-info h2 { margin: 0; font-size: 32px; font-weight: bold; }
        .studio-info p { margin: 3px 0; font-size: 14px; }
        .title { font-size: 48px; font-weight: normal; margin-right: 20px; }

        /* Konten Utama */
        .content { margin-top: 50px; display: flex; justify-content: space-between; }
        
        /* Bagian Kiri (Detail) */
        .details { width: 65%; }
        .details p { margin-bottom: 30px; font-size: 16px; display: flex; align-items: baseline; }
        .details strong { width: 180px; display: inline-block; }
        .details .line { 
            flex-grow: 1; 
            border-bottom: 1.5px solid #000; 
            padding-left: 10px; 
            font-weight: normal;
        }
        
        /* Kotak Abu-abu (Stamp) */
        .stamp-box { 
            background-color: #999; 
            width: 160px; 
            height: 60px; 
            margin-top: 10px; 
            margin-left: 180px; 
        }

        /* Bagian Kanan (Tanda Tangan) */
        .signature-area { 
            width: 30%; 
            text-align: left; 
            position: relative; 
            margin-top: -10px;
        }
        
        /* Efek titik-titik (Watermark) di belakang tanda tangan */
        .watermark {
            position: absolute;
            top: 0;
            right: -20px;
            width: 200px;
            height: 200px;
            background-image: radial-gradient(#d3d3d3 30%, transparent 30%);
            background-size: 15px 15px;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.6;
        }

        .signature-area p { font-size: 16px; margin-bottom: 5px; }
        .signature-line { 
            margin-top: 80px; 
            border-top: 1px solid #000; 
            width: 200px;
            padding-top: 5px; 
            font-weight: bold; 
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <!-- Gambar logo akan diambil dari folder assets oleh server -->
            <img src="file://{{LOGO_PATH}}" alt="Logo PrangArt">
            <div class="studio-info">
                <h2>PrangArt Lab</h2>
                <p>Home Music Production Studio</p>
                <p>Email: prangart.lab@gmail.com | WhatsApp: 08977250597</p>
            </div>
        </div>
        <div class="title">Kuitansi</div>
    </div>

    <!-- Konten -->
    <div class="content">
        <div class="details">
            <p><strong>Nomor:</strong> <span class="line">{{NOMOR}}</span></p>
            <p><strong>Sudah terima dari:</strong> <span class="line">{{NAMA}}</span></p>
            <p><strong>Banyaknya uang:</strong> <span class="line">{{DP}}</span></p>
            <p><strong>Untuk pembayaran:</strong> <span class="line">DP Pemesanan Musik Tari - {{JUDUL}}</span></p>
            
            <div class="stamp-box"></div>
        </div>

        <div class="signature-area">
            <div class="watermark"></div>
            <p>Samarinda, {{TANGGAL}}</p>
            <p>Penerima,</p>
            
            <div class="signature-line">
                Fikri Yassaar Arrazaq
            </div>
        </div>
    </div>
</body>
</html>
