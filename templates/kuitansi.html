<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Times New Roman', Times, serif; padding: 40px; color: #000; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { width: 80px; }
        .studio-info h2 { margin: 0; font-size: 28px; }
        .studio-info p { margin: 2px 0; font-size: 14px; }
        .title { font-size: 40px; font-weight: normal; }
        .content { margin-top: 40px; display: flex; justify-content: space-between; }
        .details { width: 60%; }
        .details p { margin-bottom: 25px; font-size: 16px; }
        .details span { display: inline-block; border-bottom: 1px solid #000; width: 70%; margin-left: 10px; padding-left: 10px; }
        .signature-area { width: 30%; text-align: center; margin-top: 50px; position: relative; }
        .signature-line { margin-top: 80px; border-top: 1px solid #000; padding-top: 5px; font-weight: bold; }
        .stamp-box { background-color: #999; width: 150px; height: 60px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <!-- Pastikan file logo.png ada di folder assets -->
            <img src="file://{{LOGO_PATH}}" alt="Logo">
            <div class="studio-info">
                <h2>PrangArt Lab</h2>
                <p>Home Music Production Studio</p>
                <p>Email: prangart.lab@gmail.com | WhatsApp: 08977250597</p>
            </div>
        </div>
        <div class="title">Kuitansi</div>
    </div>

    <div class="content">
        <div class="details">
            <p><strong>Nomor:</strong> <span>{{NOMOR}}</span></p>
            <p><strong>Sudah terima dari:</strong> <span>{{NAMA}}</span></p>
            <p><strong>Banyaknya uang:</strong> <span>{{DP}}</span></p>
            <p><strong>Untuk pembayaran:</strong> <span>DP Pemesanan Musik Tari - {{JUDUL}}</span></p>
            <div class="stamp-box"></div>
        </div>

        <div class="signature-area">
            <p>Samarinda, {{TANGGAL}}</p>
            <p>Penerima,</p>
            <div class="signature-line">Fikri Yassaar Arrazaq</div>
        </div>
    </div>
</body>
</html>
